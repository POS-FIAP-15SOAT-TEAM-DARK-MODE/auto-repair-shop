openapi: 3.0.0
info:
  title: Auto-Repair-Shop API
  version: "1.0.0"
  description: OpenAPI specification for the project. Contains the currently available route(s).
servers:
  - url: http://localhost:{PORT}
    description: Local development server
    variables:
      PORT:
        default: "8080"
        description: Port number for the server
paths:
  /ping:
    get:
      summary: Ping the API
      description: Health check endpoint that returns a simple message.
      tags:
        - Health
      responses:
        "200":
          description: Successful ping
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: pong

  /v1/services:
    post:
      summary: Register a new Service
      description: Endpoint to create a new service object.
      tags:
        - Service
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        "201":
          description: Successful created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceResponse'
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content

    get:
      summary: List Services
      description: List registered services with pagination and optional status filter.
      tags:
        - Service
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            format: int64
            default: 1
            minimum: 1
          description: Page number (1-based).
        - in: query
          name: pageSize
          schema:
            type: integer
            format: int64
            default: 10
            minimum: 1
          description: Number of items per page.
        - in: query
          name: status
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
          description: Filter services by status.
      responses:
        "200":
          description: Successful list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListServicesResponse'
        "500":
          description: Internal Server Error

components:
  schemas:
    CreateServiceRequest:
      type: object
      properties:
        name:
          type: string
          description: Service name
          example: Alinhamento
        description:
          type: string
          description: Description of the service being provided
          example: Alinhamento completo das rodas do veículo
        price:
          type: string
          description: Price as string, decimal allowed, no thousands separator
          example: "199.00"
        status:
          type: string
          description: Status of the service. Must be a valid service status enum string.
          example: ACTIVE
      required:
        - name
        - description
        - price
        - status
    CreateServiceResponse:
      type: object
      properties:
        id:
          type: string
          description: Service ID
          example: 272e933f-273e-4ef7-a38d-2ab1dd8c234c
        name:
          type: string
          description: Service name
          example: Alinhamento
        description:
          type: string
          description: Description of the service being provided
          example: Alinhamento completo das rodas do veículo
        price:
          type: string
          description: Price as string, decimal allowed, no thousands separator
          example: "199.00"
        status:
          type: string
          description: Status of the service. Must be a valid service status enum string.
          example: ACTIVE
      required:
        - id
        - name
        - description
        - price
        - status
    ListServicesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateServiceResponse'
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
      required:
        - items
        - totalItems
        - totalPages
        - pageSize
        - page
