sonar.projectKey=POS-FIAP-15SOAT-TEAM-DARK-MODE_auto-repair-shop
sonar.organization=pos-fiap-15soat-team-dark-mode

sonar.projectName=Auto Repair Shop
sonar.projectVersion=1.0

sonar.sources=.
sonar.exclusions=**/*_test.go,**/mocks/**,migrations/**,docs/**,tmp/**,cmd/**
sonar.tests=.
