apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-repair-shop
  labels:
    app: auto-repair-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-repair-shop
  template:
    metadata:
      labels:
        app: auto-repair-shop
    spec:
      containers:
        - name: app
          # Overridden per overlay via the kustomize `images:` transformer.
          image: auto-repair-shop:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          # Requests are required for the HPA CPU/memory targets to work.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
