apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# The gateway's Kubernetes workload only. It holds no secrets and no database:
# it validates nothing and talks to the services through their ClusterIP Services.
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

images:
  - name: auto-repair-shop
    newTag: dev
