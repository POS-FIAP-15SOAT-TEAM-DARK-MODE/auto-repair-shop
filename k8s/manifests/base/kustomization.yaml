apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# The app's Kubernetes workload only. Networking is owned by Terraform in
# auto-repair-shop-infra-k8s; the database (RDS) by auto-repair-shop-infra-db.
resources:
  - namespace.yaml
  - configmap.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - migrate-job.yaml

images:
  - name: auto-repair-shop
    newTag: dev
