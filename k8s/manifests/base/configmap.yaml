apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: auto-repair-shop
# Gateway runtime configuration. Upstreams default to the in-cluster Services
# of the namespace. The lambda upstream stays unset: the customer login is
# served by the AWS API Gateway in front of this service.
data:
  PORT: "8080"
  LOG_LEVEL: "INFO"
  UPSTREAM_TIMEOUT: "30s"
  CUSTOMER_UPSTREAM: "http://customer-service:8081"
  CATALOG_UPSTREAM: "http://catalog-service:8082"
  BILLING_UPSTREAM: "http://billing-service:8083"
  EXECUTION_UPSTREAM: "http://execution-service:8084"
  HISTORY_UPSTREAM: "http://history-service:8085"
  SERVICE_ORDER_UPSTREAM: "http://service-order-service:8086"
