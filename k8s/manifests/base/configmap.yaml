apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: auto-repair-shop
# Non-sensitive runtime config (mirrors .env). Sensitive values live in the
# Secret. POSTGRES_HOST points at the in-cluster Postgres by default and is
# overridden to the RDS endpoint in the aws overlay.
data:
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "autorepairshop"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  JWT_EXPIRES_IN: "24h"
  BCRYPT_COST: "12"
  LOG_LEVEL: "INFO"
  PORT: "8080"
