apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-repair-shop
---
# Grants only what the app Deployment's wait-for-migrations initContainer
# needs: read the db-migrate Job's status. Nothing else in the app talks to
# the Kubernetes API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auto-repair-shop-migrate-watcher
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auto-repair-shop-migrate-watcher
subjects:
  - kind: ServiceAccount
    name: auto-repair-shop
roleRef:
  kind: Role
  name: auto-repair-shop-migrate-watcher
  apiGroup: rbac.authorization.k8s.io
