apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels:
    app: db-migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: OnFailure
      # migrate/migrate does not wait for the DB; block until it accepts conns.
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do echo 'waiting for database...'; sleep 2; done
          envFrom:
            - configMapRef:
                name: app-config
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          # k8s substitutes $(VAR) from the container env at runtime.
          args:
            - -path=/migrations
            - -database=postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(POSTGRES_SSLMODE)
            - up
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        # db-migrations is generated from the repo's migrations/ dir by the
        # Makefile (`make migrations`) to keep a single source of truth without
        # copying SQL into the manifests tree.
        - name: migrations
          configMap:
            name: db-migrations
