# External Secrets Operator reads the RDS password + JWT from Secrets Manager
# (written by the aws Terraform state) and materialises them into the k8s Secret
# `app-secrets` that the Deployment / migrate Job consume.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # No serviceAccountRef: uses the External Secrets controller's IRSA role.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: auto-repair-shop-stg/app
        property: POSTGRES_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: auto-repair-shop-stg/app
        property: JWT_SECRET
