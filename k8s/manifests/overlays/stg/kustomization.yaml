apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# The gateway has no database and no secrets: only environment-specific settings.
resources:
  - ../../base
  - ingress.yaml

components:
  - ../../components/observability

# Image published to ECR. The pipeline overrides newTag with the commit SHA.
images:
  - name: auto-repair-shop
    newName: 000000000000.dkr.ecr.us-east-1.amazonaws.com/auto-repair-shop
    newTag: latest

patches:
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: app-config
  - path: patch-hpa.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: auto-repair-shop
