apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: auto-repair-shop
type: Opaque
# Dev-safe defaults for LOCAL use only. On AWS this Secret is created by the
# External Secrets Operator from Secrets Manager (see overlays/stg|prd).
stringData:
  POSTGRES_PASSWORD: "postgres"
  JWT_SECRET: "local_dev_secret"
