apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# Restricted-account (AWS Academy Learner Lab) overlay. No ALB Ingress and no
# External Secrets: IRSA is unavailable there. The app Secret is created by the
# pipeline from Secrets Manager, and the app is reached via `kubectl port-forward`
# (a NodePort is also exposed for direct node access).
resources:
  - ../../base

patches:
  - path: patch-service-nodeport.yaml
    target:
      kind: Service
      name: auto-repair-shop
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: app-config
