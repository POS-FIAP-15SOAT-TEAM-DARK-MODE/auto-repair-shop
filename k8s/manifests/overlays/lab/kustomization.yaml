apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# Restricted-account (AWS Academy Learner Lab) overlay. No ALB Ingress: the
# gateway is exposed through a LoadBalancer Service, and its host is published
# to SSM for the AWS API Gateway.
resources:
  - ../../base

components:
  - ../../components/observability

patches:
  - path: patch-service-loadbalancer.yaml
    target:
      kind: Service
      name: auto-repair-shop
