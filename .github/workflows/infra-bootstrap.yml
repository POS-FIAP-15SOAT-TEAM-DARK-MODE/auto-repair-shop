name: Infra bootstrap (one-time)

# Run this ONCE, manually, to seed AWS: the state bucket, the GitHub OIDC
# provider, the deploy/terraform IAM roles and ECR. It is the only workflow that
# uses static AWS keys (repo secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).
# After it succeeds, everything else runs via OIDC and the keys can be removed.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  STATE_BUCKET: auto-repair-shop-tfstate

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (static keys, one-time)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Ensure the Terraform state bucket exists
        run: |
          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "state bucket already exists, skipping"
          else
            terraform -chdir=k8s/terraform/bootstrap init
            terraform -chdir=k8s/terraform/bootstrap apply -auto-approve \
              -var "state_bucket_name=$STATE_BUCKET"
          fi

      - name: Apply shared (ECR + OIDC provider + IAM roles)
        run: |
          terraform -chdir=k8s/terraform/shared init
          terraform -chdir=k8s/terraform/shared apply -auto-approve

      - name: Show outputs (copy these into GitHub Environments)
        run: terraform -chdir=k8s/terraform/shared output
