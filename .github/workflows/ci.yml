name: CI

on:
  pull_request:

# Cancel in-progress runs for the same PR when new commits are pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"

jobs:
  pre-commit:
    name: Pre-commit (lint & code patterns)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build -v ./...

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        env:
          LOG_LEVEL: PANIC
        run: go test ./... --race -v

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with coverage
        env:
          LOG_LEVEL: PANIC
        run: go test ./... -coverprofile=coverage.out

      - name: Enforce total coverage >= 80% (generated mocks excluded)
        run: |
          grep -v '/mocks/' coverage.out > coverage.filtered.out
          COV=$(go tool cover -func=coverage.filtered.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Total coverage: ${COV}%" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v c="$COV" 'BEGIN{exit !(c>=80)}'

      - name: Enforce route matcher coverage >= 90%
        env:
          LOG_LEVEL: PANIC
        run: |
          go test ./internal/gateway/match/ -cover | tee /dev/stderr | awk '
            /coverage:/ { pct=$5; gsub("%","",pct); print "internal/gateway/match", pct"%" >> ENVIRON["GITHUB_STEP_SUMMARY"]; if (pct+0 < 90) bad=1 }
            END { exit bad }'

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        # Full history so SonarQube can resolve blame and PR analysis.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate coverage report
        env:
          LOG_LEVEL: PANIC
        run: go test ./... -coverprofile=coverage.out

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  e2e:
    name: E2E (local ecosystem)
    runs-on: ubuntu-latest
    needs: build
    env:
      # The services' develop branch must already contain the F3-F6 work (waves 2 and 3) for this job to pass.
      SERVICES_BRANCH: develop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: e2e/go.sum

      - name: Clone the service repositories
        run: make clone

      - name: Start the local ecosystem
        run: docker compose up -d --build

      - name: Wait for the services and the gateway (ready, up to 3 minutes)
        run: sh scripts/wait-ready.sh 180

      - name: Run the e2e scenarios
        run: make e2e

      - name: Dump the ecosystem logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Tear the ecosystem down
        if: always()
        run: docker compose down -v
