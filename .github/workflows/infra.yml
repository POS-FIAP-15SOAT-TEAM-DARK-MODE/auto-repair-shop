name: Infra (Terraform)

on:
  pull_request:
    paths:
      - "k8s/terraform/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      layer:
        description: Which Terraform state to run
        type: choice
        options: [shared, aws, addons]
        default: aws
      environment:
        description: Workspace (ignored for `shared`)
        type: choice
        options: [stg, prd]
        default: stg
      action:
        description: plan or apply
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  # On PRs: no credentials, just fmt + validate every state.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: fmt & validate
        run: |
          terraform fmt -check -recursive k8s/terraform
          for d in bootstrap shared aws addons; do
            echo "== $d =="
            terraform -chdir="k8s/terraform/$d" init -backend=false -input=false
            terraform -chdir="k8s/terraform/$d" validate
          done

  # Manual plan/apply against AWS via OIDC (Terraform role from the shared state).
  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform ${{ inputs.action }} — ${{ inputs.layer }} (${{ inputs.environment }})
        working-directory: k8s/terraform/${{ inputs.layer }}
        run: |
          terraform init
          if [ "${{ inputs.layer }}" != "shared" ]; then
            terraform workspace select "${{ inputs.environment }}" 2>/dev/null \
              || terraform workspace new "${{ inputs.environment }}"
          fi
          terraform ${{ inputs.action }} ${{ inputs.action == 'apply' && '-auto-approve' || '' }}

      - name: Show outputs
        if: inputs.action == 'apply'
        working-directory: k8s/terraform/${{ inputs.layer }}
        run: terraform output
