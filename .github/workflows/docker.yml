name: Docker

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

# Only one deploy per branch at a time; newer pushes supersede in-flight runs.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required for GitHub OIDC -> AWS role assumption.
permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: auto-repair-shop

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'PRD' || 'STG' }}
    env:
      AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || (secrets.AWS_ACCESS_KEY_ID != '' && 'static' || 'oidc') }}
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_AUTH_MODE == 'oidc'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials (static)
        if: env.AWS_AUTH_MODE == 'static'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Resolve image ref
        id: image
        run: echo "ref=${{ steps.ecr.outputs.registry }}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish
    environment: ${{ github.ref == 'refs/heads/main' && 'PRD' || 'STG' }}
    env:
      AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || (secrets.AWS_ACCESS_KEY_ID != '' && 'static' || 'oidc') }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_AUTH_MODE == 'oidc'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials (static)
        if: env.AWS_AUTH_MODE == 'static'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Resolve cluster and RDS endpoint
        run: |
          ENV_NAME=$([ "$GITHUB_REF" = "refs/heads/main" ] && echo prd || echo stg)
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          CLUSTER="${{ vars.EKS_CLUSTER_NAME }}"
          [ -z "$CLUSTER" ] && CLUSTER="auto-repair-shop-${ENV_NAME}-eks"
          RDS="${{ vars.RDS_HOST }}"
          if [ -z "$RDS" ]; then
            RDS=$(aws rds describe-db-instances \
              --db-instance-identifier "auto-repair-shop-${ENV_NAME}-db" \
              --region "$REGION" \
              --query 'DBInstances[0].Endpoint.Address' --output text)
          fi
          CALLER=$(aws sts get-caller-identity --query Arn --output text)
          echo "$CALLER" | grep -qiE 'voclabs|labrole' && LAB=true || LAB=false
          {
            echo "DEPLOY_REGION=$REGION"
            echo "DEPLOY_CLUSTER=$CLUSTER"
            echo "DEPLOY_RDS=$RDS"
            echo "ENV_NAME=$ENV_NAME"
            echo "LAB_MODE=$LAB"
          } >> "$GITHUB_ENV"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$DEPLOY_REGION" --name "$DEPLOY_CLUSTER"

      - name: Resolve overlay
        id: overlay
        run: |
          if [ "$LAB_MODE" = "true" ]; then
            echo "path=k8s/manifests/overlays/lab" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "path=k8s/manifests/overlays/prd" >> "$GITHUB_OUTPUT"
          else
            echo "path=k8s/manifests/overlays/stg" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync migrations ConfigMap
        run: |
          kubectl create namespace auto-repair-shop --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap db-migrations --from-file=migrations \
            -n auto-repair-shop --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n auto-repair-shop delete job db-migrate --ignore-not-found

      - name: Provision app secret and remove legacy Ingress (lab)
        if: env.LAB_MODE == 'true'
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "auto-repair-shop-${ENV_NAME}/app" \
            --region "$DEPLOY_REGION" --query SecretString --output text)
          kubectl -n auto-repair-shop create secret generic app-secrets \
            --from-literal=POSTGRES_PASSWORD="$(echo "$SECRET_JSON" | jq -r .POSTGRES_PASSWORD)" \
            --from-literal=JWT_SECRET="$(echo "$SECRET_JSON" | jq -r .JWT_SECRET)" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n auto-repair-shop delete ingress auto-repair-shop --ignore-not-found

      - name: Deploy
        run: |
          OVERLAY="${{ steps.overlay.outputs.path }}"
          if [ "$LAB_MODE" = "true" ]; then
            sed -i "s#RDS_HOST_PLACEHOLDER#$DEPLOY_RDS#" "$OVERLAY/patch-configmap.yaml"
          fi
          kubectl apply -k "$OVERLAY"
          kubectl -n auto-repair-shop patch configmap app-config --type merge \
            -p "{\"data\":{\"POSTGRES_HOST\":\"$DEPLOY_RDS\"}}"
          kubectl -n auto-repair-shop set image deploy/auto-repair-shop \
            app=${{ needs.publish.outputs.image }}

      - name: Wait for rollout
        run: kubectl -n auto-repair-shop rollout status deploy/auto-repair-shop --timeout=180s

      - name: Publish app URL
        if: env.LAB_MODE == 'true'
        run: |
          for _ in $(seq 1 30); do
            HOST=$(kubectl -n auto-repair-shop get svc auto-repair-shop \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            [ -n "$HOST" ] && break
            sleep 10
          done
          if [ -n "$HOST" ]; then
            {
              echo "### App is up"
              echo ""
              echo "- API: http://$HOST"
              echo "- Health: http://$HOST/ping"
              echo "- Swagger: http://$HOST/swagger/index.html"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LoadBalancer hostname not ready yet — rerun or check the service." >> "$GITHUB_STEP_SUMMARY"
          fi
