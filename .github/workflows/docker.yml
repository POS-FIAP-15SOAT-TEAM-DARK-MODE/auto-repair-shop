name: Docker

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

# Only one deploy per branch at a time; newer pushes supersede in-flight runs.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required for GitHub OIDC -> AWS role assumption.
permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: auto-repair-shop

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'PRD' || 'STG' }}
    env:
      AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || (secrets.AWS_ACCESS_KEY_ID != '' && 'static' || 'oidc') }}
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_AUTH_MODE == 'oidc'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials (static)
        if: env.AWS_AUTH_MODE == 'static'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Resolve image ref
        id: image
        run: echo "ref=${{ steps.ecr.outputs.registry }}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish
    environment: ${{ github.ref == 'refs/heads/main' && 'PRD' || 'STG' }}
    env:
      AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || (secrets.AWS_ACCESS_KEY_ID != '' && 'static' || 'oidc') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_AUTH_MODE == 'oidc'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials (static)
        if: env.AWS_AUTH_MODE == 'static'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Resolve cluster
        run: |
          ENV_NAME=$([ "$GITHUB_REF" = "refs/heads/main" ] && echo prd || echo stg)
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          CLUSTER="${{ vars.EKS_CLUSTER_NAME }}"
          [ -z "$CLUSTER" ] && CLUSTER="auto-repair-shop-${ENV_NAME}-eks"
          CALLER=$(aws sts get-caller-identity --query Arn --output text)
          echo "$CALLER" | grep -qiE 'voclabs|labrole' && LAB=true || LAB=false
          {
            echo "DEPLOY_REGION=$REGION"
            echo "DEPLOY_CLUSTER=$CLUSTER"
            echo "ENV_NAME=$ENV_NAME"
            echo "LAB_MODE=$LAB"
          } >> "$GITHUB_ENV"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$DEPLOY_REGION" --name "$DEPLOY_CLUSTER"

      - name: Resolve overlay
        id: overlay
        run: |
          if [ "$LAB_MODE" = "true" ]; then
            echo "path=k8s/manifests/overlays/lab" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "path=k8s/manifests/overlays/prd" >> "$GITHUB_OUTPUT"
          else
            echo "path=k8s/manifests/overlays/stg" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove legacy Ingress (lab)
        if: env.LAB_MODE == 'true'
        run: kubectl -n auto-repair-shop delete ingress auto-repair-shop --ignore-not-found

      - name: Deploy
        run: |
          OVERLAY="${{ steps.overlay.outputs.path }}"
          kubectl apply -k "$OVERLAY"
          kubectl -n auto-repair-shop set image deploy/auto-repair-shop \
            app=${{ needs.publish.outputs.image }}

      - name: Wait for rollout
        run: kubectl -n auto-repair-shop rollout status deploy/auto-repair-shop --timeout=180s

      - name: Publish app URL
        if: env.LAB_MODE == 'true'
        run: |
          for _ in $(seq 1 30); do
            HOST=$(kubectl -n auto-repair-shop get svc auto-repair-shop \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            [ -n "$HOST" ] && break
            sleep 10
          done
          if [ -n "$HOST" ]; then
            {
              echo "### App is up"
              echo ""
              echo "- API: http://$HOST"
              echo "- Health: http://$HOST/ping"
              echo "- Swagger: http://$HOST/swagger/index.html"
            } >> "$GITHUB_STEP_SUMMARY"

            # Handoff point for auto-repair-shop-infra-k8s's gateway state:
            # this ELB is Kubernetes-created, not Terraform-managed, so
            # there's no terraform_remote_state output for it. SSM is the
            # stable place the gateway's data source reads it from.
            aws ssm put-parameter \
              --name "/auto-repair-shop/$ENV_NAME/app-backend-host" \
              --type String \
              --value "$HOST" \
              --overwrite \
              --region "$DEPLOY_REGION"
          else
            echo "LoadBalancer hostname not ready yet — rerun or check the service." >> "$GITHUB_STEP_SUMMARY"
          fi
