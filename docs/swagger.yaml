openapi: 3.0.0
info:
  title: Auto-Repair-Shop API
  version: "1.0.0"
  description: OpenAPI specification for the project. Contains the currently available route(s).
servers:
  - url: http://localhost:{PORT}
    description: Local development server
    variables:
      PORT:
        default: "8080"
        description: Port number for the server
security:
  - SessionToken: []
paths:
  /ping:
    get:
      summary: Ping the API
      description: Health check endpoint that returns a simple message.
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Successful ping
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: pong

  /v1/customers:
    post:
      summary: Create a customer
      description: Creates a new customer along with a linked user account and assigns the CUSTOMER role. Supports both individual (CPF) and company (CNPJ) types. Alphanumeric CNPJ format is supported (RFB 2243/2024).
      tags:
        - Customers
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Invalid request body or document validation failed (CPF/CNPJ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 400
                errors:
                  - invalid CPF
        "409":
          description: CPF, CNPJ or email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 409
                error: resource already exists
        "422":
          description: Business rule violation (e.g. constraint failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 422
                error: data violates business constraints
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 500
                error: Internal Server Error

    get:
      summary: Get customer by document
      description: Returns the customer matching the provided CPF or CNPJ document. Accepts formatted (e.g. `111.444.777-35`) or plain (`11144477735`) values.
      tags:
        - Customers
      parameters:
        - in: query
          name: document
          required: true
          schema:
            type: string
          description: CPF or CNPJ of the customer (formatted or plain digits)
          example: "111.444.777-35"
      responses:
        "200":
          description: Customer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Missing or invalid document format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 400
                errors:
                  - document must be a valid CPF (11 digits) or CNPJ (14 characters)
        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 404
                error: customer not found
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/customers/{id}:
    get:
      summary: Get customer by ID
      description: Returns the customer with the specified UUID.
      tags:
        - Customers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Customer UUID
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        "200":
          description: Customer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 404
                error: customer not found
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Update a customer
      description: Partially updates name, email and/or phone. All fields are optional — only provided fields are changed. CPF and CNPJ are immutable. Returns 204 when the customer does not exist (idempotent).
      tags:
        - Customers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Customer UUID
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
      responses:
        "200":
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "204":
          description: Customer not found (no-op)
        "400":
          description: Validation error (e.g. invalid name format, empty phone)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 400
                errors:
                  - the username must be longer than 3 characters and can only contain letters and spaces
        "409":
          description: Email already in use by another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 409
                error: resource already exists
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete a customer
      description: Removes the customer and its associated user account in a single transaction. Returns 204 on success or when the customer does not exist (idempotent). Returns an error for business rule violations (e.g. linked service orders).
      tags:
        - Customers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Customer UUID
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        "204":
          description: Customer deleted or not found
        "409":
          description: Customer has linked service orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 409
                error: customer has associated service orders
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/login:
    post:
      summary: Login a user
      description: Logs in a user and returns a JWT token. Requires email and password.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginRequest"
      responses:
        "200":
          description: User logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_in:
                    type: integer
        "400":
          description: Invalid request body or validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account. Requires name, email, password, and confirm_password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request body or validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/works:
    post:
      summary: Register a new Work
      description: Endpoint to create a new work object.
      tags:
        - Work
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkRequest'
      responses:
        "201":
          description: Successful created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkResponse'
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content

    get:
      summary: List Works
      description: List registered works with pagination and optional status filter.
      tags:
        - Work
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            format: int64
            default: 1
            minimum: 1
          description: Page number (1-based).
        - in: query
          name: pageSize
          schema:
            type: integer
            format: int64
            default: 10
            minimum: 1
          description: Number of items per page.
        - in: query
          name: status
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
          description: Filter works by status.
      responses:
        "200":
          description: Successful list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorksResponse'
        "500":
          description: Internal Server Error

  /v1/works/{id}:
    put:
      summary: Update an existing Work
      description: Endpoint to edit an existing work object.
      tags:
        - Work
      parameters:
        - in: path
          required: true
          name: id
          schema:
            type: string
          description: Id of work to be updated.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkRequest'
      responses:
        "200":
          description: Successful updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkResponse'
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content

    delete:
      summary: List Works
      description: List registered works with pagination and optional status filter.
      tags:
        - Work
      parameters:
        - in: path
          required: true
          name: id
          schema:
            type: string
          description: Id of work to be deleted.
      responses:
        "204":
          description: Successful deleted
        "500":
          description: Internal Server Error
 
  /v1/vehicles:
    get:
      summary: Get vehicle by license plate
      description: Retrieve a vehicle by its normalized license plate. The license plate must follow supported formats (old or Mercosul).
      tags:
        - Vehicle
      security:
        - SessionToken: []
      parameters:
        - in: query
          name: plate
          required: true
          schema:
            type: string
          description: License plate (supports old and Mercosul formats)
      responses:
        "200":
          description: Vehicle found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: create a new vehicle register
      description: insert a new vehicle in our database
      tags:
        - Vehicle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        "201":
          description: Successful created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content

  /v1/vehicles/{id}:
    put:
      summary: update a vehicle register
      description: update a vehicle in our database
      tags:
        - Vehicle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        "200":
          description: Successful created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content
    delete:
      summary: delete a vehicle register
      description: delete a vehicle in our database
      tags:
        - Vehicle
      parameters:
        - in: path
          required: true
          name: id
          schema:
            type: string
          description: Id of vehicle to be deleted.
      responses:
        "204":
          description: Successful deleted
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content

  /v1/supplies:
    post:
      summary: Create a supply
      description: Creates a new supply with name, description, unit price, stock quantity and version.
      tags:
        - Supply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyRequest'
      responses:
        "201":
          description: Supply created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyResponse'
        "400":
          description: Invalid request body or validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Business rule violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/service-order:
      post:
        summary: Create a new service order
        description: Create a new service order for a given customer and vehicle
        tags:
          - ServiceOrder
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceOrderRequest'
        responses:
          "201":
            description: Service order successfully created
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CreateServiceOrderResponse'
          "400":
            description: Invalid Body Content
          "401":
            description: Unauthorized (missing or invalid JWT)
          "403":
            description: Forbidden (insufficient permissions)
          "422":
            description: Business rule violation
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          "500":
            description: Internal Server Error

  /v1/service-order/{id}/history:
    get:
      summary: Get service order history
      description: Returns the history of status changes for the specified service order.
      tags:
        - ServiceOrder
      security:
        - SessionToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Service order UUID
      responses:
        "200":
          description: History retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderHistoryResponse'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized (missing or invalid JWT)
        "403":
          description: Forbidden (insufficient permissions)
        "404":
          description: Service order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error

components:
  securitySchemes:
      SessionToken:
        type: http
        scheme: bearer
        bearerFormat: JWT
  schemas:
    UserRegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - confirm_password
      properties:
        name:
          type: string
          description: Full name of the user
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          description: User password
        confirm_password:
          type: string
          format: password
          description: Password confirmation (must match password)

    UserLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          description: User password

    UserLoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        expires_in:
          type: integer
          description: Token expiration duration
        user:
          $ref: "#/components/schemas/UserResponse"

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
        name:
          type: string
          description: Full name of the user
        email:
          type: string
          format: email
          description: User email address

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: integer
          description: HTTP status code
        errors:
          type: array
          items:
            type: string
          description: List of validation/business error messages

    CreateCustomerRequest:
      type: object
      required:
        - name
        - email
        - password
        - type
        - document
        - phone
      properties:
        name:
          type: string
          example: João Silva
        email:
          type: string
          format: email
          example: joao@example.com
        password:
          type: string
          minLength: 8
          example: Secret@123
        type:
          type: string
          enum: [INDIVIDUAL, COMPANY]
          example: INDIVIDUAL
        document:
          type: string
          description: CPF (e.g. 111.444.777-35) for INDIVIDUAL or CNPJ (e.g. 11.222.333/0001-81) for COMPANY. Alphanumeric CNPJ is also accepted (e.g. AB.CDE.FGH/0001-95).
          example: "111.444.777-35"
        company_name:
          type: string
          description: Required when type is COMPANY.
          example: Empresa SA
        phone:
          type: string
          example: "11999999999"

    CustomerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        name:
          type: string
          example: João Silva
        email:
          type: string
          example: joao@example.com
        type:
          type: string
          enum: [INDIVIDUAL, COMPANY]
          example: INDIVIDUAL
        document:
          type: string
          description: Sanitized CPF (11 digits) for INDIVIDUAL or CNPJ (14 chars) for COMPANY
          example: "11144477735"
        company_name:
          type: string
          example: ""
        phone:
          type: string
          example: "11999999999"

    UpdateCustomerRequest:
      type: object
      description: All fields are optional. Only provided fields are updated.
      properties:
        name:
          type: string
          description: Full name (min 3 chars, letters and spaces only)
          example: Novo Nome
        email:
          type: string
          format: email
          example: novo@example.com
        phone:
          type: string
          example: "11888888888"

    CreateWorkRequest:
      type: object
      properties:
        name:
          type: string
          description: Work name
          example: Alinhamento
        description:
          type: string
          description: Description of the work being provided
          example: Alinhamento completo das rodas do veículo
        price:
          type: string
          description: Price as string, decimal allowed, no thousands separator
          example: "199.00"
        status:
          type: string
          description: Status of the work. Must be a valid work status enum string.
          example: ACTIVE
      required:
        - name
        - description
        - price
        - status

    CreateWorkResponse:
      type: object
      properties:
        id:
          type: string
          description: Work ID
          example: 272e933f-273e-4ef7-a38d-2ab1dd8c234c
        name:
          type: string
          description: Work name
          example: Alinhamento
        description:
          type: string
          description: Description of the work being provided
          example: Alinhamento completo das rodas do veículo
        price:
          type: string
          description: Price as string, decimal allowed, no thousands separator
          example: "199.00"
        status:
          type: string
          description: Status of the work. Must be a valid work status enum string.
          example: ACTIVE
      required:
        - id
        - name
        - description
        - price
        - status
    ListWorksResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateWorkResponse'
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
      required:
        - items
        - totalItems
        - totalPages
        - pageSize
        - page
    WorkOrderHistoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 8b6f1c2e-3c4a-4f8c-9a2b-1d2e3f4a5b6c
        service_order_id:
          type: string
          format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        previous_status:
          type: string
          example: RECEIVED
        new_status:
          type: string
          example: IN_DIAGNOSIS
        created_at:
          type: string
          format: date-time
          example: "2026-04-05T12:34:56Z"
      required:
        - id
        - service_order_id
        - previous_status
        - new_status
        - created_at

    WorkOrderHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderHistoryEntry'
      required:
        - items

    VehicleRequest:
      type: object
      required:
        - brand
        - license_plate
        - customer_id
        - model
        - year
      properties:
        brand:
          type: string
          example: chevrolet
        license_plate:
          type: string
          example: aaa-2a22
        customer_id:
          type: string
          format: uuid
          example: b8415e84-730a-4624-a1c3-74cf59b95d6d
        model:
          type: string
          example: onix
        year:
          type: integer
          example: 2019

    VehicleResponse:
      type: object
      required:
        - id
        - license_plate
        - brand_model
        - year
        - customer_id
      properties:
        id:
          type: string
          format: uuid
          example: 55160da4-d243-4920-9426-5ce97aefb2fc
        license_plate:
          type: string
          example: AAA2A22
        brand_model:
          type: string
          example: chevrolet - onix
        year:
          type: integer
          example: 2019
        customer_id:
          type: string
          format: uuid
          example: b8415e84-730a-4624-a1c3-74cf59b95d6d
    SupplyRequest:
      type: object
      required:
        - name
        - description
        - unit_price
        - stock_quantity
        - version
      properties:
        name:
          type: string
          example: string
        description:
          type: string
          example: string
        unit_price:
          type: number
          format: float
          example: 00.0
        stock_quantity:
          type: integer
          example: 0
        version:
          type: integer
          example: 0

    SupplyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: string
        name:
          type: string
          example: string
        description:
          type: string
          example: string
        unit_price:
          type: number
          format: float
          example: 00.0
        stock_quantity:
          type: integer
          example: 0
        version:
          type: integer
          example: 0

    CreateServiceOrderRequest:
      type: object
      required:
        - client
        - vehicle
      properties:
        client:
          type: string
          description: ID of the customer/client requesting the service
        vehicle:
          type: string
          description: ID of the vehicle for the service order

    CreateServiceOrderResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the service order
        customer_id:
          type: string
          description: Customer ID
        vehicle_id:
          type: string
          description: Vehicle ID
        status:
          type: string
          description: Service order status (e.g. RECEIVED, IN_DIAGNOSIS, etc)
        total_amount:
          type: number
          format: float
          description: Total budget amount for this service order
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
