openapi: 3.0.0
info:
  title: Auto-Repair-Shop API
  version: "1.0.0"
  description: OpenAPI specification for the project. Contains the currently available route(s).
servers:
  - url: http://localhost:{PORT}
    description: Local development server
    variables:
      PORT:
        default: "8080"
        description: Port number for the server
paths:
  /v1/customers:
    post:
      summary: Create a customer
      description: Creates a new customer along with a linked user account. Supports both individual (CPF) and company (CNPJ) types. Alphanumeric CNPJ format is supported (RFB 2243/2024).
      tags:
        - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCustomerResponse"
        "400":
          description: Invalid request body or document validation failed (CPF/CNPJ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 400
                errors:
                  - invalid CPF
        "409":
          description: CPF, CNPJ or email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 409
                error: resource already exists
        "422":
          description: Business rule violation (e.g. constraint failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 422
                error: data violates business constraints
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 500
                error: Internal Server Error

  /ping:
    get:
      summary: Ping the API
      description: Health check endpoint that returns a simple message.
      tags:
        - Health
      responses:
        "200":
          description: Successful ping
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: pong

  /v1/auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account. Requires name, email, password, and confirm_password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request body or validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/services:
    post:
      summary: Register a new Service
      description: Endpoint to create a new service object.
      tags:
        - Service
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        "201":
          description: Successful created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceResponse'
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content

components:
  schemas:
    UserRegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - confirm_password
      properties:
        name:
          type: string
          description: Full name of the user
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          description: User password
        confirm_password:
          type: string
          format: password
          description: Password confirmation (must match password)

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
        name:
          type: string
          description: Full name of the user
        email:
          type: string
          format: email
          description: User email address

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: integer
          description: HTTP status code
        errors:
          type: array
          items:
            type: string
          description: List of validation/business error messages

    CreateCustomerRequest:
      type: object
      required:
        - name
        - email
        - password
        - type
        - document
        - phone
      properties:
        name:
          type: string
          example: João Silva
        email:
          type: string
          format: email
          example: joao@example.com
        password:
          type: string
          minLength: 6
          example: secret123
        type:
          type: string
          enum: [INDIVIDUAL, COMPANY]
          example: INDIVIDUAL
        document:
          type: string
          description: CPF (e.g. 111.444.777-35) for INDIVIDUAL or CNPJ (e.g. 11.222.333/0001-81) for COMPANY. Alphanumeric CNPJ is also accepted (e.g. AB.CDE.FGH/0001-95).
          example: "111.444.777-35"
        company_name:
          type: string
          description: Required when type is COMPANY.
          example: Empresa SA
        phone:
          type: string
          example: "11999999999"

    CreateCustomerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        name:
          type: string
          example: João Silva
        email:
          type: string
          example: joao@example.com
        type:
          type: string
          example: INDIVIDUAL
        document:
          type: string
          example: "11144477735"
        company_name:
          type: string
          example: ""
        phone:
          type: string
          example: "11999999999"

    CreateServiceRequest:
      type: object
      properties:
        name:
          type: string
          description: Service name
          example: Alinhamento
        description:
          type: string
          description: Description of the service being provided
          example: Alinhamento completo das rodas do veículo
        price:
          type: string
          description: Price as string, decimal allowed, no thousands separator
          example: "199.00"
        status:
          type: string
          description: Status of the service. Must be a valid service status enum string.
          example: ACTIVE
      required:
        - name
        - description
        - price
        - status

    CreateServiceResponse:
      type: object
      properties:
        id:
          type: string
          description: Service ID
          example: 272e933f-273e-4ef7-a38d-2ab1dd8c234c
        name:
          type: string
          description: Service name
          example: Alinhamento
        description:
          type: string
          description: Description of the service being provided
          example: Alinhamento completo das rodas do veículo
        price:
          type: string
          description: Price as string, decimal allowed, no thousands separator
          example: "199.00"
        status:
          type: string
          description: Status of the service. Must be a valid service status enum string.
          example: ACTIVE
      required:
      - id
        - name
        - description
        - price
        - status
