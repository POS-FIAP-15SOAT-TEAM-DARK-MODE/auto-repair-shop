openapi: 3.0.3
info:
  title: Auto Repair Shop Gateway
  version: 1.0.0
  description: >-
    Single public entry point of the Auto Repair Shop. It routes each request to
    the service that owns it. Business endpoints are documented by each service
    (see /swagger/index.html). Requests under /internal/ are never forwarded.
servers:
  - url: /
paths:
  /ping:
    get:
      summary: Gateway liveness
      responses:
        "200":
          description: The gateway is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong
  /ready:
    get:
      summary: Gateway readiness
      description: Checks that every configured upstream answers /ping within 2 seconds.
      responses:
        "200":
          description: Every configured upstream is ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ready
        "503":
          description: At least one upstream is not ready. Only the names are listed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 503
                  errors:
                    type: array
                    items:
                      type: string
                    example: ["upstreams not ready"]
                  upstreams:
                    type: array
                    items:
                      type: string
                    example: ["catalog"]
  /metrics:
    get:
      summary: Prometheus metrics
      description: Exposes http_request_duration_seconds with the labels method, route, upstream and status.
      responses:
        "200":
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
